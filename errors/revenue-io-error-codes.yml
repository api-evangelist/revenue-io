source: https://support.revenue.io/integrations/salesforce/common-salesforce-errors/
format: salesforce-status-code
note: >-
  NOT RFC 9457. Revenue.io publishes no HTTP API and therefore no
  application/problem+json catalog. Its published error reference is the "Common
  Salesforce Errors" section of the knowledge center — the Salesforce platform
  status codes a customer actually sees when Revenue.io writes to their org — plus
  the result-object envelope returned by the RDNACadence Apex/Flow API. Both are
  captured verbatim below; nothing is invented.
envelope:
  surface: RDNACadence Apex classes and Flow invocable actions
  source: https://support.revenue.io/guided-selling/salesforce-administration/api-endpoints/
  shape:
    success: boolean — whether the action completed
    errorMessage: String — the failure message when success is false
    errors: List — collected error messages
    participantActionId: Id — the record the result refers to
    successfulIds: List — ids that completed successfully
  behavior_switch:
    setting: GS_PublicSettings__c.logging_throwExceptions__c
    'true': an exception is thrown on error
    'false': the error message is returned inside the result object
    note: >-
      The error CHANNEL is a per-org custom setting, so an integrator cannot rely
      on either shape without reading the customer's configuration first.
