aid: revenue-io
name: Revenue.io
description: Revenue.io is a Salesforce-native revenue orchestration platform offering
  real-time guidance, call analytics, rep performance tracking, conversation insights,
  and CRM activity synchronization. Formerly known as RingDNA, it powers RevOps, Sales
  Engagement, and Conversation Intelligence for inside sales teams using Salesforce.
  It publishes no public REST API or OpenAPI; its documented programmable surface is
  a set of Apex classes and Flow invocable actions in the RDNACadence managed-package
  namespace, plus an OAuth-gated remote MCP server at https://app.ringdna.com/mcp
  discovered from RFC 9728 protected-resource metadata on api.revenue.io.
