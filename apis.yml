apis:
  - aid: revenue-io:revenue-io-api
    name: Revenue.io API
    description: Revenue.io's programmable surface for guided selling, call analytics,
      rep performance data, conversation insights, and CRM activity synchronization.
      Exposed as RDNACadence Apex classes and Flow invocable actions inside the
      customer's own Salesforce org (Create Quick Action, Complete Participant Action,
      Skip Participant Action), authorized by a support-issued API Key and Secret bound
      to the Salesforce Organization ID. A separate OAuth-gated remote MCP server runs
      at https://app.ringdna.com/mcp. No OpenAPI is published.
