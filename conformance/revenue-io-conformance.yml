      claim: >-
        "meets core security requirements for the HIPAA security rule"; operates as
        a Business Associate with encryption and access controls
    - id: gdpr
      name: GDPR
      claim: administrative safeguards, access controls, data backup and disaster recovery
    - id: ccpa-cpra
      name: CCPA / CPRA
      claim: tooling to manage and delete customer data
    - id: casa-tier-2
      name: Google CASA Tier 2
      claim: >-
        "passed a rigorous independent security assessment validating it can
        safely and securely handle Google user data"
    - id: tcpa
      name: TCPA
      claim: SMS and call blocklists
  note: >-
    Certifications are asserted on the marketing security page. Revenue.io
