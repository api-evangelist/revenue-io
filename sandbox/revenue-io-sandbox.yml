generated: '2026-08-13'
method: searched
source: >-
  https://support.revenue.io/guided-selling/release-notes/guided-selling-winter-2025-release-v12/
  and https://support.revenue.io/guided-selling/salesforce-administration/installation-and-setup/setup-api-credentials/
description: >-
  Revenue.io's test environment is a Salesforce sandbox org, not a vendor-hosted
  developer sandbox. There is no public test mode, no test key prefix, no test
  card or magic identifier set, and no self-service way in: a customer installs
  the managed package into their own Salesforce sandbox and Revenue.io Support
  issues matching credentials. Everything below is published by Revenue.io; no
  test values are invented, because Revenue.io publishes none.
test_live_separation:
  model: separate Salesforce org (sandbox vs production)
  key_prefixes: null
  key_prefix_note: >-
    Revenue.io publishes no test/live key prefix convention. The same API Key /
    API Secret shape is used in both, distinguished only by which Salesforce
    Organization ID they are bound to.
install:
  production: https://login.salesforce.com/packaging/installPackage.apexp?p0=04tIS0000011bRqYAI
  sandbox: https://test.salesforce.com/packaging/installPackage.apexp?p0=04tIS0000011bRqYAI
  recommendation: '"Install for Admins Only" is recommended'
  source: https://support.revenue.io/guided-selling/release-notes/guided-selling-winter-2025-release-v12/
credentials:
  self_service: false
  issuance: >-
    API Key and API Secret "are generated by your Implementation Manager or the
    Support Team"; there is no key-generation console.
  binding: >-
    Credentials are bound to the Salesforce Organization ID. A partial-copy
    sandbox refresh can change that Org ID and break the link, surfacing as
    "Uh Oh! License required." even with a valid Guided Selling license.
  refresh_procedure: >-
    Contact Revenue.io Support with the new Salesforce Organization ID (e.g.
    00D600...) and the RingDNA Account ID from the sandbox Account Overview page;
    Revenue.io re-binds the Org ID in its database.
  source: >-
    https://support.revenue.io/guided-selling/salesforce-administration/installation-and-setup/setup-api-credentials/
test_values:
  cards: []
  phone_numbers: []
  identifiers: []
  note: >-
    None published. Documented Apex examples use redacted placeholders only —
    Salesforce id stubs such as '003xxx' for a Contact/Lead and 'a0Hxxx' for a
    Template — which are illustrative, not callable test values.
time_simulation:
  supported: false
fixtures_or_triggers:
  supported: false
verification:
  post_upgrade_batch: ActionMigrationBatch (Setup > Apex Jobs)
  data_check_soql: >-
    SELECT id, RDNACadence__ActivationType__c, RDNACadence__Type__c FROM
    RDNACadence__CadenceAction__c
  expectation: all rows should have values for both fields
summary:
  public_sandbox: false
  self_service_signup: false
  gate: implementation-manager-or-support
