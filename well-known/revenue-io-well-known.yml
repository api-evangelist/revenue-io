note: 'Revenue.io serves real RFC 8414 authorization-server metadata and RFC 9728 protected-resource metadata
  from api.revenue.io. Both documents point at https://app.ringdna.com — ringDNA is Revenue.io''s former
  company name and the name of its current Communications Hub product, and the same Play-framework backend
  answers on both api.revenue.io and app.ringdna.com with byte-identical metadata, so the app.ringdna.com
  host is Revenue.io''s own. The protected resource named by that metadata is an MCP server (see mcp/revenue-io-mcp.yml).
  support.revenue.io is a Hugo static site whose catch-all answers HTTP 200 with an HTML shell for EVERY
  /.well-known/* path — those are soft-404s, recorded below as misses, not as documents.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
