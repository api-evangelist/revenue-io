description: >-
  Revenue.io's data model is not behind an API — it IS Salesforce. The managed
  packages install custom objects into the customer's own org, and Revenue.io
  publishes their API names, relationships and field sets. Captured verbatim from
  the provider's Object Architecture reference and Conversation Object Fields
  article; no schema was inferred, because there is no OpenAPI in this repo to
  derive one from.
namespaces:
  RDNACadence: Guided Selling managed package
  ringdna: Revenue Intelligence package (ringDNA for Salesforce)
entities:
  - name: Sequence
    api_name: RDNACadence__Cadence__c
    namespace: RDNACadence
    description: Container object defining the sequence template, rules, and configuration
    primary_use: Sequence definition and management
    docs: https://support.revenue.io/guided-selling/reference-architecture/object-architecture/sequence/
  - name: Action
    api_name: RDNACadence__CadenceAction__c
    namespace: RDNACadence
    description: Template objects defining individual steps within a sequence
    primary_use: Action configuration and templates
    docs: https://support.revenue.io/guided-selling/reference-architecture/object-architecture/action/
    lifecycle: >-
      Being eliminated by the Guided Selling V12 "Simplified Sequence Action
      Model" — see lifecycle/revenue-io-lifecycle.yml.
    action_types: [Call, SMS, Email, Task]
  - name: Participant
    api_name: Lead | Contact
    namespace: standard-salesforce
    description: Standard Salesforce Lead or Contact objects
    primary_use: Target records for sequence enrollment
  - name: Sequence Association
    api_name: RDNACadence__Sequence_Association__c
    namespace: RDNACadence
    description: Enrollment record linking sequences to participants
    primary_use: Enrollment tracking and metadata
    docs: https://support.revenue.io/guided-selling/reference-architecture/object-architecture/sequence-association/
  - name: Participant Action
    api_name: RDNACadence__Sequence_Action__c
    namespace: RDNACadence
    description: Instance records of actions for specific participants
    primary_use: Individual action execution tracking
    docs: https://support.revenue.io/guided-selling/reference-architecture/object-architecture/participant-action/
    related_docs:
      - https://support.revenue.io/guided-selling/reference-architecture/object-architecture/participant-action/participant-action-status-glossary/
      - https://support.revenue.io/guided-selling/reference-architecture/object-architecture/participant-action/system-deferral-reasons/
    note: >-
      The object the three published API operations act on — createQuickActions
      creates it, completeParticipantActions and skipParticipantActions transition it.
