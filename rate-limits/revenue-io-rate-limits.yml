name: Revenue.io Rate Limits
description: Revenue.io does not publish specific API rate limit thresholds in its
  public documentation. Rate limits are enforced on the REST API for guided selling
  endpoints and CRM synchronization calls. Limits may vary by plan tier and are
  subject to change. Contact Revenue.io support for plan-specific rate limit details.
url: https://support.revenue.io/
created: '2026-06-13'
modified: '2026-08-13'
generated: '2026-08-13'
method: searched
source: >-
  https://support.revenue.io/administration/managing-salesforce-configurations-and-settings/monitor-your-salesforce-api-usage/
  and https://support.revenue.io/integrations/salesforce/common-salesforce-errors/request-limit-exceeded/
limit_count: 0
published_headers: []
findings: >-
  Re-searched 2026-08-13. Revenue.io publishes NO numeric rate limit of its own,
  no window, no burst allowance, no X-RateLimit-*/RateLimit-*/Retry-After response
  header and no exhaustion status code — because it publishes no HTTP API for
  third parties to call. The only rate limit an integrator actually meets is the
  customer's OWN Salesforce org API governor limit, which Revenue.io consumes on
  their behalf: it documents how to monitor that consumption
  ("Monitor Your Salesforce API Usage") and catalogs the resulting
  REQUEST_LIMIT_EXCEEDED status code in its error reference. The MCP endpoint at
  https://app.ringdna.com/mcp returned no rate-limit headers on the
  unauthenticated 401 observed on 2026-08-13.
references_checked:
  - url: https://support.revenue.io/administration/managing-salesforce-configurations-and-settings/monitor-your-salesforce-api-usage/
    finding: how to monitor Salesforce API usage; no Revenue.io threshold published
  - url: https://support.revenue.io/integrations/salesforce/common-salesforce-errors/request-limit-exceeded/
    finding: REQUEST_LIMIT_EXCEEDED — a Salesforce governor limit, not a Revenue.io limit
  - url: https://app.ringdna.com/mcp
    status: 401
    finding: no rate-limit headers on the response
rateLimits:
  - name: REST API
    description: General rate limits applied to REST API requests for guided selling,
      call analytics, and CRM synchronization endpoints.
    type: api
    scope: account
    published: false
    notes: Specific thresholds are not publicly documented; contact Revenue.io support
      for details applicable to your subscription tier.
  - name: Salesforce CRM Sync
    description: Rate limits applicable to Salesforce CRM data synchronization
      calls, which are additionally constrained by Salesforce API governor limits.
    type: integration
    scope: account
    published: false
    notes: Subject to both Revenue.io limits and Salesforce API governor limits
      (typically 15,000 API calls per 24-hour period for Enterprise edition).
  - name: Conversation AI Transcription
    description: Rate limits for real-time transcription and conversation intelligence
      processing requests.
    type: feature
    scope: account
    published: false
    notes: Constrained by available processing capacity; no public thresholds documented.
references:
